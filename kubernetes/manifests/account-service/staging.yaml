apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/instance: staging
    app.kubernetes.io/name: account-service
    app.kubernetes.io/version: 0.1.3
  name: docker-auth
  namespace: staging-account-service
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: name:image-registry-auth
        version: latest
      secretKey: secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    creationPolicy: Owner
    name: docker-auth
    template:
      data:
        .dockerconfigjson: "{{ .secret | toString }}"
      type: kubernetes.io/dockerconfigjson
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/reload: app-server-config
  labels:
    app.kubernetes.io/component: app-server
    app.kubernetes.io/instance: staging
    app.kubernetes.io/name: account-service
    app.kubernetes.io/version: 0.1.3
  name: app-server
  namespace: staging-account-service
spec:
  minReadySeconds: 0
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      cdk8s.io/metadata.addr: staging-app-server-deployment-c83f8ba5
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app-server
        app.kubernetes.io/instance: staging
        app.kubernetes.io/name: account-service
        app.kubernetes.io/version: 0.1.3
        cdk8s.io/metadata.addr: staging-app-server-deployment-c83f8ba5
      name: app-server
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - /usr/local/bin/bun
            - /app/applications/account/src/commands/start-api-server.ts
          env:
            - name: CONFIG_FILE_PATH
              value: /app/config/config.json
            - name: NODE_ENV
              value: production
            - name: AUTH_CLIENT_ID
              value: account-service
          image: ghcr.io/mxvincent/account-service:0.1.3
          imagePullPolicy: Always
          name: app-server
          ports:
            - containerPort: 4000
              name: http
          resources:
            limits:
              memory: 250Mi
            requests:
              cpu: 50m
              memory: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - mountPath: /app/config/config.json
              name: config
              subPath: config.json
      dnsPolicy: ClusterFirst
      hostNetwork: false
      imagePullSecrets:
        - name: docker-auth
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: Always
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          secret:
            secretName: app-server-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: staging
    app.kubernetes.io/name: account-service
    app.kubernetes.io/version: 0.1.3
  name: app-server
  namespace: staging-account-service
spec:
  externalIPs: []
  ports:
    - name: http
      port: 4000
      targetPort: 4000
  selector:
    cdk8s.io/metadata.addr: staging-app-server-deployment-c83f8ba5
  type: ClusterIP
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/component: app-server
    app.kubernetes.io/instance: staging
    app.kubernetes.io/name: account-service
    app.kubernetes.io/version: 0.1.3
  name: app-server-config
  namespace: staging-account-service
spec:
  data:
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: name:staging-account-service
        metadataPolicy: None
        property: POSTGRES_HOST
        version: latest
      secretKey: STAGING_ACCOUNT_SERVICE_POSTGRES_HOST
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: name:staging-account-service
        metadataPolicy: None
        property: POSTGRES_PORT
        version: latest
      secretKey: STAGING_ACCOUNT_SERVICE_POSTGRES_PORT
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: name:staging-account-service
        metadataPolicy: None
        property: POSTGRES_DATABASE
        version: latest
      secretKey: STAGING_ACCOUNT_SERVICE_POSTGRES_DATABASE
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: name:staging-account-service
        metadataPolicy: None
        property: POSTGRES_USERNAME
        version: latest
      secretKey: STAGING_ACCOUNT_SERVICE_POSTGRES_USERNAME
    - remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: name:staging-account-service
        metadataPolicy: None
        property: POSTGRES_PASSWORD
        version: latest
      secretKey: STAGING_ACCOUNT_SERVICE_POSTGRES_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    creationPolicy: Owner
    name: app-server-config
    template:
      data:
        config.json: '{"app":{"logLevel":"info","timeZone":"UTC"},"database":{"type":"postgres","host":"{{ .STAGING_ACCOUNT_SERVICE_POSTGRES_HOST | toString }}","port":"{{ .STAGING_ACCOUNT_SERVICE_POSTGRES_PORT | toString }}","database":"{{ .STAGING_ACCOUNT_SERVICE_POSTGRES_DATABASE | toString }}","username":"{{ .STAGING_ACCOUNT_SERVICE_POSTGRES_USERNAME | toString }}","password":"{{ .STAGING_ACCOUNT_SERVICE_POSTGRES_PASSWORD | toString }}"},"server":{"host":"0.0.0.0","port":4000}}'
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/component: app-server
          app.kubernetes.io/instance: staging
          app.kubernetes.io/name: account-service
          app.kubernetes.io/version: 0.1.3
