name: 'docker-build'
run-name: 'docker-build ${{ inputs.image }}:${{ inputs.version }}'
on:
  workflow_dispatch:
    inputs:
      application:
        description: Workspace directory of the application under applications/, passed to the dockerfile as APP_NAME
        type: string
        required: true
      image:
        description: Image name, with its registry
        type: string
        required: true
      version:
        description: Released version of the application
        type: string
        required: true
jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6
      - name: 'Generate docker metadata (tags, labels)'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ inputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=sha
      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@v3
      - name: 'Set up buildx'
        uses: docker/setup-buildx-action@v3
      - name: 'Login to container registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Prevent image rebuild'
        id: image-exists
        uses: ./.github/actions/docker-image-exists
        with:
          image: ${{ inputs.image }}
          tag: ${{ inputs.version }}
      - name: 'Build and push'
        if: ${{ steps.image-exists.outputs.exists == 'false' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_NAME=${{ inputs.application }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
