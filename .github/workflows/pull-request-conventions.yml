name: 'pull-request-conventions'
# Checks the title, body, labels and changesets of a pull request against docs/conventions.
# Separate from pull-request.yml so that editing the title or a label does not re-run the test suite.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Setup bun'
        uses: oven-sh/setup-bun@v2
      - name: 'Test the conventions check'
        run: bun test scripts/
      - name: 'Check the pull request'
        run: bun scripts/check-pull-request.ts
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
